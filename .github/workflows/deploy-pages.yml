name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Fires after the listings-sync workflow finishes, even though that bot's
  # commit uses the default GITHUB_TOKEN (which does NOT trigger `on: push`
  # workflows, to prevent loops) — this is the reliable way to redeploy
  # whenever fresh listing data lands.
  workflow_run:
    workflows: ["Sync listings from thebeverlyhillsestates.com"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
